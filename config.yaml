# Vertical layout. Run "calibrate" once to set the avatar/gameplay boxes by dragging.
layout:
  mode: blurfit          # blurfit = whole stream centered on a blurred copy | stack = peanut on top, gameplay below
  top_height: 760        # stack mode: height of the peanut panel (out of 1920)
  avatar:   {x: 0.70, y: 0.50, w: 0.30, h: 0.50}   # fractions of the source frame
  gameplay: {x: 0.15, y: 0.00, w: 0.70, h: 1.00}

captions:
  enabled: false        # controlled from the app's Settings screen
  font: Arial Black      # any font installed on your PC (Impact, Anton, Arial Black...)
  size: 84
  words_per_line: 3
  color: "&H00FFFFFF"     # white   (ASS colours are &H00BBGGRR)
  highlight: "&H0000E5FF" # yellow  - the word being spoken
  outline: 7

titles:
  use_claude: auto       # auto = use Claude if ANTHROPIC_API_KEY is set, otherwise a simple template
  model: claude-haiku-5-5
  # Your best-performing titles - Claude copies this style.
  examples:
    - "PEANUT CANT USE HIS 007 INTRO ANYMORE"
    - "MR BEAST TRIED TO MAKE PEANUT FACE REVEAL"
    - "PEANUT GETS AWKWARD AROUND GAMER GIRLS"
    - "PEANUT EXPLAINS WHY HE DOESNT STREAM TARKOV"
    - "DILLON DANIS RETURNS...PEANUT FLAMES HIM"
    - "Peanut Runs Into A Karen | Rust Highlights"

upload:
  privacy: private       # uploads stay private until their scheduled time
  schedule: true         # false = upload now as the privacy above
  timezone: America/Los_Angeles
  schedule_times: ["11:45", "16:30", "20:15"]   # up to this many Shorts per day
  category_id: "20"      # Gaming
  made_for_kids: false

twitch:
  # Free from https://dev.twitch.tv/console/apps (or set TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET)
  client_id: ""
  client_secret: ""
