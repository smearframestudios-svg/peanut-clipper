# Peanut Clipper settings. Edit freely — comments explain each part.

streamer:
  name: Burnt Peanut
  twitch_login: theburntpeanut
  credit_line: "Streamer: TheBurntPeanut - twitch.tv/theburntpeanut"
  hashtags: ["#burntpeanut", "#arcraiders", "#shorts", "#bungulators"]

paths:
  work_dir: work        # downloads, transcripts, temp files
  output_dir: output    # finished Shorts + clips.json per job

download:
  max_height: 1080      # 1080 keeps the peanut sharp when cropped

whisper:
  model: small.en       # tiny.en / base.en (fast) ... small.en (good) ... medium.en (best, slow)
  device: cpu           # set to cuda if you have an NVIDIA GPU with CUDA installed
  compute_type: int8    # use float16 with cuda

detect:
  chat_delay_sec: 8     # chat reacts this many seconds after the moment
  clip_len_sec: 35      # default Short length before snapping to sentences
  min_len_sec: 15
  max_len_sec: 58
  tail_sec: 4           # keep a few seconds after the punchline
  spacing_sec: 90       # two clips can't be closer than this
  candidates: 30        # moments to transcribe and re-rank per VOD
  keep: 12              # Shorts to render per VOD
  weights:
    chat: 1.0           # how much faster chat is moving than normal
    hype: 1.3           # LMAO / KEKW / CLIP IT / skull spam
    audio: 0.6          # loud moments (yelling, laughing)
    names: 2.5          # famous people mentioned (your best Shorts are these)
    topics: 2.0         # hot topics (face reveal, bans, beef...)

# Famous names: "alias|alias|alias": weight. First alias is the display name.
